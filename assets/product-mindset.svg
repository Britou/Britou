<svg width="1200" height="310" viewBox="0 0 1200 310" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Como Raphael transforma ideia em produto</title><desc id="description">Três etapas: entender o fluxo, desenhar a interface e conectar dados reais.</desc><rect width="1200" height="310" rx="22" fill="#151517"/>
  <text x="54" y="58" fill="#FF8A38" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">MEU JEITO DE CONSTRUIR</text><path d="M54 82H1146" stroke="#3C3C43"/>
  <rect x="54" y="112" width="336" height="152" rx="16" fill="#202024" stroke="#39393F"/><circle cx="91" cy="151" r="18" fill="#3A2A1D"/><path d="M84 151H98M91 144V158" stroke="#FF8A38" stroke-width="2.5" stroke-linecap="round"/><text x="123" y="147" fill="#F6F6F7" font-family="Arial, sans-serif" font-size="21" font-weight="700">Entendo o fluxo</text><text x="82" y="197" fill="#B9B9C0" font-family="Arial, sans-serif" font-size="16">Começo pelo problema e pelo caminho</text><text x="82" y="221" fill="#B9B9C0" font-family="Arial, sans-serif" font-size="16">que a pessoa precisa percorrer.</text>
  <path d="M408 188H454" stroke="#FF6A00" stroke-width="2" stroke-dasharray="7 7"/><path d="M448 182L460 188L448 194" stroke="#FF6A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="474" y="112" width="336" height="152" rx="16" fill="#202024" stroke="#39393F"/><circle cx="511" cy="151" r="18" fill="#3A2A1D"/><path d="M504 156L509 151L513 154L520 145" stroke="#FF8A38" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="543" y="147" fill="#F6F6F7" font-family="Arial, sans-serif" font-size="21" font-weight="700">Dou forma à interface</text><text x="502" y="197" fill="#B9B9C0" font-family="Arial, sans-serif" font-size="16">Transformo a lógica em uma experiência</text><text x="502" y="221" fill="#B9B9C0" font-family="Arial, sans-serif" font-size="16">clara, responsiva e fácil de usar.</text>
  <path d="M828 188H874" stroke="#FF6A00" stroke-width="2" stroke-dasharray="7 7"/><path d="M868 182L880 188L868 194" stroke="#FF6A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="894" y="112" width="252" height="152" rx="16" fill="#202024" stroke="#39393F"/><circle cx="931" cy="151" r="18" fill="#3A2A1D"/><circle cx="925" cy="151" r="3.5" fill="#FF8A38"/><circle cx="937" cy="144" r="3.5" fill="#FF8A38"/><circle cx="937" cy="158" r="3.5" fill="#FF8A38"/><path d="M928 150L934 145M928 152L934 157" stroke="#FF8A38" stroke-width="2"/><text x="963" y="147" fill="#F6F6F7" font-family="Arial, sans-serif" font-size="21" font-weight="700">Conecto dados</text><text x="922" y="197" fill="#B9B9C0" font-family="Arial, sans-serif" font-size="16">Levo a experiência para</text><text x="922" y="221" fill="#B9B9C0" font-family="Arial, sans-serif" font-size="16">um produto funcional.</text>
</svg>
